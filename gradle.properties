org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# NOTE: do NOT add org.gradle.java.home to this file.
#
# Gradle 8.x only runs on JDK 17-24, while recent Android Studio bundles JBR 25
# and will fail to sync. If you hit that, set the JDK on YOUR OWN machine - this
# file is committed, so an absolute path here would break everyone else:
#
#   ~/.gradle/gradle.properties   ->   org.gradle.java.home=/path/to/jdk-21
#
# or in Android Studio: Settings -> Build Tools -> Gradle -> Gradle JDK -> 21